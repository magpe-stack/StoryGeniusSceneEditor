<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scriptor</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0052CC">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scriptor">
    
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Cabeçalho Principal -->
    <header class="app-header">
        <div class="brand-container">
            <img src="logo.svg" alt="Logotipo Scriptor" class="app-logo" width="28" height="28">
            <span class="app-title">Scriptor</span>
        </div>
        
        <!-- Botão Intuitivo Claro/Escuro -->
        <button id="theme-toggle" class="theme-toggle-btn" title="Alternar tema" aria-label="Alternar modo claro e escuro">
            <svg id="theme-icon-sun" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="theme-icon-moon" class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </header>

    <!-- Área de Trabalho em 3 Blocos -->
    <main class="app-workspace" id="workspace">
        
        <!-- Bloco Esquerdo: Barra Vertical + Subpainel Integrado -->
        <aside class="panel panel-left" id="panel-left">
            <div class="icon-bar">
                <!-- 0. Novo Projeto -->
                <button class="nav-icon-btn" id="btn-new-project" title="Novo Projeto" aria-label="Criar Novo Projeto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="12" y1="11" x2="12" y2="17"></line>
                        <line x1="9" y1="14" x2="15" y2="14"></line>
                    </svg>
                </button>

                <div class="nav-divider"></div>

                <!-- 1. Exportar -->
                <button class="nav-icon-btn" data-target="submenu-export" title="Exportar projeto" aria-label="Exportar projeto">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                </button>

                <!-- 2. Carregar -->
                <button class="nav-icon-btn" data-target="submenu-import" title="Carregar arquivo" aria-label="Carregar arquivo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>

                <div class="nav-divider"></div>

                <!-- 3. Teoria -->
                <button class="nav-icon-btn" data-target="submenu-theory" title="Teoria e Referências" aria-label="Teoria e Referências">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
                        <path d="M6 6h10"></path>
                        <path d="M6 10h10"></path>
                    </svg>
                </button>
            </div>

            <!-- Subpainel de Conteúdo das Opções -->
            <div class="sidebar-subpanel" id="sidebar-subpanel">
                <div class="submenu-content" id="submenu-export">
                    <span class="submenu-title">Exportar</span>
                    <button class="submenu-item" data-action="export-json">Exportar JSON</button>
                    <button class="submenu-item" data-action="export-md">Exportar MD</button>
                    <button class="submenu-item" data-action="export-txt">Exportar TXT</button>
                    <button class="submenu-item" data-action="export-docx">Exportar DOCX</button>
                </div>

                <div class="submenu-content" id="submenu-import">
                    <span class="submenu-title">Carregar</span>
                    <button class="submenu-item" data-action="import-json">Carregar JSON</button>
                    <button class="submenu-item" data-action="import-md">Carregar MD</button>
                    <button class="submenu-item" data-action="import-txt">Carregar TXT</button>
                    <button class="submenu-item" data-action="import-docx">Carregar DOCX</button>
                </div>

                <div class="submenu-content" id="submenu-theory">
                    <span class="submenu-title">Teoria</span>
                    <button class="submenu-item" data-action="theory-portuguese">Português</button>
                    <button class="submenu-item" data-action="theory-storygenius">Story Genius</button>
                    <button class="submenu-item" data-action="theory-template">Template SG</button>
                    <button class="submenu-item" data-action="theory-planning">Planejamento SG</button>
                    <button class="submenu-item" data-action="theory-tips">Dicas</button>
                </div>
            </div>
        </aside>

        <!-- Bloco Central: Editor / Formulários / Cenas / Flashcards -->
        <section class="panel panel-center" id="panel-center">
            <div class="panel-placeholder" id="main-content">
                <!-- Conteúdo dinâmico renderizado via app.js -->
            </div>
        </section>

        <!-- Bloco Direito: Informações de Apoio -->
        <aside class="panel panel-right" id="panel-right">
            <div class="panel-placeholder"></div>
        </aside>
    </main>

    <!-- Importação das Teorias e Dados Primeiro -->
    <script src="data.js"></script>
    <!-- Importação da Lógica do App em Segunda Instância -->
    <script src="app.js"></script>
</body>
</html>
